<!doctype html>
<html lang="en" class="overflow-x-hidden overscroll-x-none max-w-full" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/images/inventech_logo.png" />
  <link rel="apple-touch-icon" href="/images/inventech_logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="description" content="InvenTech Engineering Laboratory Management System — Automated touchscreen apparatus borrowing, return check-in, and inventory custody kiosk for Universidad de Dagupan School of Engineering." />
  <meta name="theme-color" content="#0a0e17" />
  <title>InvenTech | UdD Engineering Laboratory Kiosk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Outfit:wght@300;400;500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Outfit:wght@300;400;500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    media="print"
    onload="this.media='all'"
  />
  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,300..800;1,300..800&family=Outfit:wght@300;400;500;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap"
    />
  </noscript>

  <script>
    (function () {
      try {
        var savedTheme = localStorage.getItem('udd_kiosk_theme_v2');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-theme', 'light');
      }

      // Kiosk Hardening: Disable right-click context menu, long-press inspect, and drag gestures
      window.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        return false;
      }, { capture: true });
    })();
  </script>
</head>

<body oncontextmenu="return false;" class="font-sans antialiased select-none min-h-screen w-full max-w-full overflow-x-hidden overscroll-x-none lg:overflow-hidden lg:h-screen lg:w-screen relative">
  <div id="root" class="min-h-screen lg:h-full w-full max-w-full overflow-x-hidden relative"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
